[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coderunner"
version = "0.2.0"
description = "Private local assistant runtime: local models, a sandbox VM, a guarded browser and opt-in connectors"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "websockets>=13",
    # Ollama's Linux archives are .tar.zst, which Python reads by itself only from 3.14.
    "zstandard>=0.22; sys_platform == 'linux' and python_version < '3.14'",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.10"]
# Remote mode (coderunner claude on): installed by itself the first time it is turned on.
claude = ["anthropic>=1,<2"]

[project.scripts]
coderunner = "coderunner.cli:main"

[tool.setuptools]
packages = [
    "coderunner",
    "coderunner.agent",
    "coderunner.browser",
    "coderunner.channels",
    "coderunner.connectors",
    "coderunner.core",
    "coderunner.files",
    "coderunner.models",
    "coderunner.safety",
    "coderunner.sandbox",
    "coderunner.server",
    "coderunner.voice",
]

[tool.setuptools.package-data]
"coderunner.server" = ["web/*.html", "web/app/*", "web/app/novnc/*", "web/app/novnc/**/*", "web/app/xterm/*"]
"coderunner.models" = ["catalog.json", "evidence.json", "measured.json", "fixtures/*"]
"coderunner.browser" = ["extension/*.json", "extension/*.js"]
"coderunner.files" = ["helper.swift"]
# The sandbox server and the desktop's installer, for a VM without its desktop (links to the files at the root).
"coderunner.sandbox" = ["vm/*"]
"coderunner.voice" = ["apple_speech.swift", "parakeet_speech.swift"]
