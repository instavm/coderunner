[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coderunner"
version = "0.2.0"
description = "Private local assistant runtime: local models, a sandbox VM, a guarded browser and opt-in connectors"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.10"]

[project.scripts]
coderunner = "coderunner.cli:main"

[tool.setuptools]
packages = [
    "coderunner",
    "coderunner.agent",
    "coderunner.browser",
    "coderunner.channels",
    "coderunner.connectors",
    "coderunner.core",
    "coderunner.files",
    "coderunner.models",
    "coderunner.safety",
    "coderunner.sandbox",
    "coderunner.server",
    "coderunner.voice",
]

[tool.setuptools.package-data]
"coderunner.server" = ["web/*.html", "web/app/*", "web/app/novnc/*", "web/app/novnc/**/*"]
"coderunner.models" = ["catalog.json", "evidence.json", "measured.json"]
"coderunner.browser" = ["extension/*.json", "extension/*.js"]
"coderunner.files" = ["helper.swift"]
"coderunner.voice" = ["apple_speech.swift", "parakeet_speech.swift"]
