# OpenSSF Scorecard: scores the repo's supply-chain practices and publishes
# the result to api.scorecard.dev, which the scorecard.dev viewer and badge
# read. publish_results only works when this runs on the default branch, and
# the job must keep to the restricted shape below (no top-level env/defaults,
# no run steps, GitHub-hosted runner).
name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # sign and publish results to api.scorecard.dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
