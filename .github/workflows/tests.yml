name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install host package
        run: python -m pip install -e . "mcp>=1.26,<2"
      - name: Shell syntax
        run: bash -n install.sh && bash -n entrypoint.sh
      - name: Unit tests
        env:
          PYTHONPATH: .:tests
          CODERUNNER_SKIP_BROWSER: "1"
        run: python -m unittest discover -s tests -v
