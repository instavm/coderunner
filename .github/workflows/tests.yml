name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # The sandbox server, as the image runs it: its pinned requirements, lint and shell checks.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install the image's requirements
        run: |
          sudo apt-get install -y libcairo2-dev pkg-config
          pip install --require-hashes -r requirements.txt
      - name: Lint
        run: |
          pip install ruff==0.15.6
          ruff check --select E9,F,B --ignore B008 server.py tests examples
          sudo apt-get install -y shellcheck
          shellcheck -S warning install.sh entrypoint.sh test-e2e.sh cleanup.sh
          bash -n install.sh entrypoint.sh test-e2e.sh cleanup.sh test-build.sh
      - name: Server tests
        run: python -m unittest -v tests.test_server tests.test_auth

  # The assistant and its host package, on the systems it supports.
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install host package
        run: python -m pip install -e . "mcp>=1.26,<2"
      - name: Unit tests
        env:
          PYTHONPATH: .:tests
          CODERUNNER_SKIP_BROWSER: "1"
        run: python -m unittest discover -s tests -v
