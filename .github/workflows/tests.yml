name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the image's requirements
        run: |
          sudo apt-get install -y libcairo2-dev pkg-config
          pip install --require-hashes -r requirements.txt
      - name: Lint
        run: |
          pip install ruff==0.15.6
          ruff check --select E9,F,B --ignore B008 server.py tests examples
          sudo apt-get install -y shellcheck
          shellcheck -S warning install.sh entrypoint.sh test-e2e.sh cleanup.sh
          bash -n install.sh entrypoint.sh test-e2e.sh cleanup.sh test-build.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
